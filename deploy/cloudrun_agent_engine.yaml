apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: paladin-governance-engine
  labels:
    cloud.googleapis.com/location: us-central1
    app.kubernetes.io/name: paladin-governance-engine
    platform: gemini-enterprise-agent-platform
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/arsanjani-genai/paladin-governance-engine:v3.0
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
        env:
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "true"
        - name: GOOGLE_CLOUD_PROJECT
          value: "arsanjani-genai"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-central1"
        - name: PALADIN_GOVERNANCE_MODE
          value: "BOUNDED_EMERGENCE"
        ports:
        - containerPort: 8080
